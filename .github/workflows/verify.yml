name: verify

# This repo ships markdown instruction files, not code — no build, no package
# manager, no test framework. The scripts/verify-*.sh harnesses ARE the test
# suite, and until this workflow existed nothing ran them: they only executed
# when a person or agent remembered to. That is how the review-and-merge mirror
# drifted twice, the second time despite a README rule telling contributors to
# re-sync in the same commit.
#
# Every harness is plain bash plus grep, diff and awk, so the default runner
# needs no setup step — except verify-knowledge-py.sh, which shells out to iwe
# and needs it installed first.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # verify-knowledge-py.sh runs plugins/notion-dev/scripts/knowledge.py, which shells
      # out to iwe. ubuntu-latest ships GLIBC 2.39, so the prebuilt npm binary runs. Pinned
      # to the version the plugin's flags were verified against (the plugin requires >=
      # 0.19), so a CI break is a change we made, not one upstream made.
      - name: Install iwe
        run: npm i -g @iwe-org/iwe@0.19.1 && iwe --version

      # Discovered rather than listed: a new scripts/verify-*.sh is picked up
      # without editing this file. A harness nobody runs is the failure mode
      # this workflow exists to remove, and a hardcoded list reintroduces it
      # the first time someone adds a script and forgets this file.
      - name: Run every verification harness
        # Explicit, because this step genuinely depends on bash: `shopt`, arrays,
        # and `${#arr[@]}` are not POSIX sh. Without the key GitHub would fall
        # back to `sh` if bash were ever absent, failing obscurely rather than
        # loudly — and a job-level `defaults.run.shell` could change it silently.
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          scripts=(scripts/verify-*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No verification harnesses found — expected at least one."
            exit 1
          fi
          failed=0
          for s in "${scripts[@]}"; do
            echo "::group::$s"
            if bash "$s"; then
              echo "$s: OK"
            else
              echo "$s: FAILED"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done
          echo
          if [ "$failed" -gt 0 ]; then
            echo "$failed harness(es) failed."
            exit 1
          fi
          echo "All ${#scripts[@]} harness(es) passed."

  # The EXECUTION half of the Python floor (issue #69). scripts/verify-python-floor.sh
  # proves every shipped script PARSES at the floor the README declares, on every runner.
  # Grammar is not execution: `str.removeprefix`, `functools.cache`, `math.lcm`,
  # `itertools.pairwise` and `zoneinfo` are all grammar-valid on 3.8 and fatal at runtime,
  # and no amount of ast.parse sees them. Only a real 3.8 interpreter does, which is what
  # this job is.
  #
  # It targets knowledge.py first among equals: the README's floor is stated as
  # "**Python 3.8+** — **required** for `scripts/knowledge.py`", so a floor job that
  # skipped it would not test the claim actually made. That is why iwe is installed here
  # as well — verify-knowledge-py.sh shells out to it.
  #
  # Linux only, deliberately. actions/python-versions publishes a win32 build for 3.8.0
  # through 3.8.10 and nothing newer, so a windows-latest cell would pin 3.8.10 (2021) and
  # report on an interpreter four years of fixes behind the 3.8.18 used here. The
  # platform-specific code path is `msvcrt.locking` in runtime.py, whose API is unchanged
  # across every 3.8+ release, and the verify-windows job above already exercises it on the
  # runner's own Python. The cross-product would cost a sixth runner minute per push to
  # test a combination neither axis leaves uncovered.
  verify-python-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install iwe
        run: npm i -g @iwe-org/iwe@0.19.1 && iwe --version

      - name: Run the Python suite on the floor interpreter
        shell: bash
        env:
          KNOWLEDGE_PY: python
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail

          # A job that silently ran 3.12 would be green and worthless -- the exact
          # silent-pass this repo refuses elsewhere. Assert the interpreter before
          # trusting anything it reports.
          python - <<'CHECK'
          import sys
          print("interpreter:", sys.version.replace("\n", " "))
          if sys.version_info[:2] != (3, 8):
              sys.exit("FAIL: expected a 3.8 interpreter, got %d.%d" % sys.version_info[:2])
          CHECK

          # Under 3.8 itself, ast.parse IS the 3.8 grammar -- no feature_version
          # approximation. This is the authoritative syntax check the harness's smoke
          # filter cannot be: it rejects `except*`, `X | Y` annotations and every other
          # construct 3.8 genuinely cannot parse.
          python - <<'SYNTAX'
          import ast, pathlib, sys
          bad = 0
          targets = sorted(pathlib.Path("plugins").rglob("*.py")) + \
                    sorted(pathlib.Path("scripts/tests").glob("*.py"))
          for p in (t for t in targets if "__pycache__" not in t.parts):
              try:
                  ast.parse(p.read_text(encoding="utf-8"), filename=str(p))
              except SyntaxError as e:
                  print("FAIL %s: %s" % (p, e)); bad += 1
          print("syntax-checked %d file(s) on this interpreter" % len(targets))
          sys.exit(1 if bad else 0)
          SYNTAX

          python -m unittest discover -s scripts/tests -p 'test_*.py'
          bash scripts/verify-knowledge-py.sh

          # The floor harness invokes Python itself, so a contributor on 3.8 must be able
          # to run it. Nothing else in CI covers that: the `verify` and `verify-windows`
          # jobs run it on the runner's own (much newer) interpreter. Running it here is
          # what makes "the suite works on the floor" a checked claim rather than one
          # somebody verified by hand once.
          bash scripts/verify-python-floor.sh

  # The Windows leg of CLAUDE.md's "Both platforms, always": every shipped plugin instruction
  # must work unchanged from WSL 2 Ubuntu and from a Windows-native Claude Code session, which
  # runs through Git Bash. This job is what makes that a checked claim rather than a stated one.
  #
  # It runs the WHOLE suite, not just verify-knowledge-py.sh. That harness is the only one that
  # executes knowledge.py, so it was long the only one thought to need a second pass — the rest
  # were called platform-neutral. That was an assumption nothing tested, and "platform-neutral"
  # is precisely the kind of claim this repo does not take on trust: a harness reaching for a
  # GNU-only flag, or tripping over a path or a line ending, would pass on Ubuntu and go
  # unnoticed. Discovery is shared with the Ubuntu job for the same reason it exists there — a
  # new scripts/verify-*.sh is picked up without editing this file.
  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install iwe
        run: npm i -g @iwe-org/iwe@0.19.1 && iwe --version

      # windows-latest has `python` on PATH; `python3` may not resolve. This is the same
      # substitution the plugin makes at runtime through the `knowledge.python` config key,
      # so the harness exercises the path a Windows client actually takes.
      - name: Run every verification harness
        shell: bash
        env:
          KNOWLEDGE_PY: python
        run: |
          set -uo pipefail
          shopt -s nullglob
          scripts=(scripts/verify-*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No verification harnesses found — expected at least one."
            exit 1
          fi
          failed=0
          for s in "${scripts[@]}"; do
            echo "::group::$s"
            if bash "$s"; then
              echo "$s: OK"
            else
              echo "$s: FAILED"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done
          echo
          if [ "$failed" -gt 0 ]; then
            echo "$failed harness(es) failed."
            exit 1
          fi
          echo "All ${#scripts[@]} harness(es) passed."
